// This module ships prebuilt native libraries and compiles no native code: the
// Android Gradle Plugin packages whatever is in src/main/jniLibs/<abi>/ into the
// consuming app, and there is deliberately no build hook for it. It does compile
// the host-context plugin class, which answers questions the Dart side cannot
// answer correctly on its own.

group 'app.coproduct.flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Matches the floor device_info_plus and package_info_plus require, so
        // this module never becomes the reason a consuming build needs a newer
        // Android Gradle Plugin than the rest of the dependency set already does.
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'app.coproduct.flutter'
    }

    // compileSdkVersion is the API level the plugin compiles against, not a
    // runtime requirement on consumers. Track latest stable supported by AGP
    // to avoid checkDebugAarMetadata conflicts with modern transitives
    // such as androidx.fragment:fragment:1.7.1 which requires compileSdk >= 34.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    // Java 17 is what the Kotlin toolchain and the plus plugins already require
    // of a consuming project, so the module matches rather than lagging.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
