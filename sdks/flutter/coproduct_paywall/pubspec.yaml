name: coproduct_paywall
description: Paywall display and Apple Pay purchases for the Coproduct Flutter SDK.
version: 0.1.0-dev
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CoproductPaywallPlugin
  assets:
    - assets/paywall-platform-script.js
