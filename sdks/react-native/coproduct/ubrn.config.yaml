rust:
  directory: ../../..
  manifestPath: ffi/coproduct-ffi-uniffi/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

ios:
  directory: ios
  # All three iOS triples so ubrn assembles a device slice (ios-arm64) plus one
  # universal simulator slice (ios-arm64_x86_64-simulator). A release build
  # resolves ARCHS per destination and CocoaPods links only a slice carrying
  # every requested arch, so device and simulator consumers each need their slice
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  # scripts/package/rn-build-native.sh builds the shipped dynamic framework
  # with cargo, because ubrn builds only a static one. This path is where a
  # direct ubrn build writes, and nothing packs it
  frameworkName: build/CoproductFFI

android:
  directory: android
  targets:
    - arm64-v8a
  useSharedLibrary: true

turboModule:
  cpp: cpp
  ts: src
  spec: NativeCoproduct
  entrypoint: src/index.tsx

# Files ubrn first generated and this package now maintains by hand:
# NativeCoproduct.ts looks the module up with get, and CoproductPackage.kt also
# registers the storage module, CoproductStorageModule.kt
noOverwrite:
  - src/index.tsx
  - src/NativeCoproduct.ts
  - android/CMakeLists.txt
  - android/src/main/java/app/coproduct/CoproductPackage.kt
