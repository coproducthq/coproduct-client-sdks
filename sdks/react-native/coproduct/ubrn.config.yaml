rust:
  directory: ../../..
  manifestPath: ffi/coproduct-ffi-uniffi/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

ios:
  directory: ios
  # All three iOS triples so ubrn assembles a device slice (ios-arm64) plus one
  # universal simulator slice (ios-arm64_x86_64-simulator). A release build
  # resolves ARCHS per destination and CocoaPods links only a slice carrying
  # every requested arch, so device and simulator consumers each need their slice
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  frameworkName: build/CoproductFFI

android:
  directory: android
  targets:
    - arm64-v8a
  useSharedLibrary: false

turboModule:
  cpp: cpp
  ts: src
  spec: NativeCoproduct
  entrypoint: src/index.tsx

noOverwrite:
  - src/index.tsx
