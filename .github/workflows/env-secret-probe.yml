name: env-secret-probe
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Fail if a release secret is visible
        run: |
          if [ -n "${{ secrets.RELEASE_APP_KEY }}" ]; then echo "LEAK"; exit 1; fi
          echo "no secret visible"
