name: Publish

# Builds the React Native package once and proves that exact file builds in
# real apps. A run started by the release automation on its own release tag
# then publishes that same file to npm with provenance, after approval, and
# finishes the GitHub release and the docs. Every other run only checks
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to check (default: the branch you run it on)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Runs for one release tag queue behind each other, so a re-dispatch never
  # races a publish already in flight. Checks-only runs never block anything
  group: ${{ github.ref_type == 'tag' && format('publish-react-native-{0}', github.ref_name) || format('publish-checks-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Every job checks out this one commit, so a push that lands mid-run can't
  # mix two commits into one result
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Decides whether this run may release. Anything short of the release
  # automation's own tag on its release commit only runs the checks
  mode:
    name: Decide the run mode
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - id: mode
        env:
          # actor_id stays the original dispatcher when someone re-runs a job
          ACTOR_ID: ${{ github.actor_id }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: node scripts/release/react-native/release-mode.mjs | tee -a "$GITHUB_OUTPUT"

  native-ios:
    name: Native ${{ matrix.target }}
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: scripts/package/rn-build-native.sh target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rn-native-${{ matrix.target }}
          path: target/rn-native/${{ matrix.target }}/
          retention-days: 1
          if-no-files-found: error

  native-android:
    name: Native ${{ matrix.abi }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked --version 4.1.2
      - run: scripts/package/rn-build-native.sh target ${{ matrix.abi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rn-native-${{ matrix.abi }}
          path: target/rn-native/${{ matrix.abi }}/
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack react-native.tgz
    needs: [resolve, native-ios, native-android]
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rn-native-*
          path: target/rn-native-download
      - name: Stage the native libraries
        run: |
          mkdir -p target/rn-native
          for d in target/rn-native-download/rn-native-*; do mv "$d" "target/rn-native/${d##*/rn-native-}"; done
          ls target/rn-native
      - run: scripts/package/rn-build-native.sh assemble ios
      - run: scripts/package/rn-build-native.sh assemble android
      - run: corepack enable && (cd sdks/react-native/coproduct && yarn install --immutable)
      - run: scripts/release/react-native/pack.sh out
      - id: hash
        run: echo "sha256=$(cut -d' ' -f1 out/react-native.tgz.sha256)" >> "$GITHUB_OUTPUT"
      - name: Record the package
        run: |
          {
            echo "### react-native.tgz"
            echo '```'
            cat out/react-native.tgz.sha256
            echo "$(wc -l < out/react-native.files.txt | tr -d ' ') files, $(stat -f %z out/react-native.tgz) bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-native-package
          path: |
            out/react-native.tgz
            out/react-native.tgz.sha256
            out/react-native.files.txt
          retention-days: 90
          if-no-files-found: error

  build-ios:
    name: iOS build ${{ matrix.app }}
    needs: [resolve, pack]
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [react-native, react-native-floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: react-native-package
          path: pkg
      - env:
          COPRODUCT_RN_TGZ: ${{ github.workspace }}/pkg/react-native.tgz
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: scripts/build/artifact-linked-rn-consumer-test-ios.sh consumer-tests/${{ matrix.app }}

  build-android:
    name: Android build ${{ matrix.app }}
    needs: [resolve, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [react-native, react-native-floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Pin Java 17 and the NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: react-native-package
          path: pkg
      - env:
          COPRODUCT_RN_TGZ: ${{ github.workspace }}/pkg/react-native.tgz
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: scripts/build/artifact-linked-rn-consumer-test-android.sh consumer-tests/${{ matrix.app }}
      - name: The app with IAP declares BILLING, so the no-IAP check is not vacuous
        if: matrix.app == 'react-native'
        run: scripts/release/react-native/billing.sh consumer-tests/react-native present

  no-iap-android:
    name: Android build without paywall packages
    needs: [resolve, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Pin Java 17 and the NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: react-native-package
          path: pkg
      - env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: scripts/release/react-native/no-iap-android.sh pkg/react-native.tgz

  publish:
    name: Publish to npm
    needs: [resolve, mode, pack, build-ios, build-android, no-iap-android]
    if: needs.mode.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # No registry-url, so npm authenticates through trusted publishing and
      # never through a token in an .npmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          v=$(npm --version)
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$v"; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
          echo "npm $v"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: react-native-package
          path: pkg
      - name: Verify this is the package the builds tested
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        shell: bash
        run: |
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::The pack job recorded no SHA-256, so the package cannot be verified"
            exit 1
          fi
          echo "$EXPECTED_SHA256  pkg/react-native.tgz" | sha256sum -c -
      - id: state
        name: Read the registry's state for this version
        env:
          VERSION: ${{ needs.mode.outputs.version }}
          ARTIFACT_SHA256: ${{ needs.pack.outputs.sha256 }}
        shell: bash
        run: node scripts/release/react-native/registry.mjs state @coproduct/react-native-sdk "$VERSION" "$ARTIFACT_SHA256" | tee -a "$GITHUB_OUTPUT"
      - name: Publish, or explain why not
        env:
          STATE: ${{ steps.state.outputs.state }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          case "$STATE" in
            publish)
              npm publish pkg/react-native.tgz --access public --provenance
              ;;
            already-published)
              echo "$VERSION is already on npm with this exact package, so the run continues to confirm it"
              ;;
            mismatch)
              echo "::error::npm already holds a different package for $VERSION. Follow the bad-version runbook in DEVELOPMENT.md"
              exit 1
              ;;
            stale)
              echo "::error::npm already has a release newer than $VERSION, so publishing it would be stale. Follow the bad-version runbook in DEVELOPMENT.md"
              exit 1
              ;;
            *)
              echo "::error::The registry check gave no usable state ($STATE), so nothing was published"
              exit 1
              ;;
          esac

  confirm:
    name: Confirm npm provenance
    needs: [resolve, mode, publish]
    if: needs.mode.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - env:
          VERSION: ${{ needs.mode.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: node scripts/release/react-native/registry.mjs confirm @coproduct/react-native-sdk "$VERSION" "$EXPECTED_COMMIT"

  finish-release:
    name: Publish the GitHub release
    needs: [mode, confirm]
    if: needs.mode.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      # The title also clears a "(not published)" left by an earlier failed run
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --title "react-native: v$VERSION"

  release-docs:
    name: Release the docs
    needs: [mode, finish-release]
    if: needs.mode.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    environment: release
    # Leaves room for the platform run it watches, whose own job limit is 45
    # minutes. Time that run spends queued is not covered by that limit
    timeout-minutes: 60
    steps:
      - name: Wait for npm to serve the version as latest
        env:
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          for _ in $(seq 1 40); do
            latest=$(npm view @coproduct/react-native-sdk dist-tags.latest 2>/dev/null || true)
            if [ "$latest" = "$VERSION" ]; then
              echo "npm serves $VERSION as latest"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not serve $VERSION as latest within 10 minutes (it serves ${latest:-nothing})"
          exit 1
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_KEY }}
          owner: coproducthq
          repositories: coproduct-platform
          permission-actions: write
      - name: Dispatch the docs release and watch it
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          response=$(gh api -X POST repos/coproducthq/coproduct-platform/actions/workflows/sdk-docs-release.yml/dispatches \
            -f ref=main -F return_run_details=true -f 'inputs[sdk]=react-native' -f "inputs[version]=$VERSION")
          id=$(jq -r '.workflow_run_id // empty' <<< "$response")
          url=$(jq -r '.html_url // empty' <<< "$response")
          case "$id" in
            '' | *[!0-9]*)
              echo "::error::The dispatch returned no run ID: $response"
              exit 1
              ;;
          esac
          echo "Docs release run: $url" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R coproducthq/coproduct-platform --exit-status

  # Fails when any check or release job failed. In a checks-only run the
  # release jobs are skipped, and skipped jobs pass
  summary:
    name: Result
    if: always()
    needs: [resolve, mode, native-ios, native-android, pack, build-ios, build-android, no-iap-android, publish, confirm, finish-release, release-docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.finalize.outputs.action }}
      version: ${{ needs.mode.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      # Runs before the checks step, so a failed build can still be marked
      - id: finalize
        name: Decide what happens to the draft release
        env:
          MODE: ${{ needs.mode.outputs.mode }}
          NEEDS: ${{ toJSON(needs) }}
          PKG: '@coproduct/react-native-sdk'
          VERSION: ${{ needs.mode.outputs.version }}
        shell: bash
        run: node scripts/release/react-native/finalize.mjs | tee -a "$GITHUB_OUTPUT"
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | scripts/release/checks-result.sh
      - name: Record the final state
        if: always()
        env:
          MODE: ${{ needs.mode.outputs.mode }}
          VERSION: ${{ needs.mode.outputs.version }}
          PUBLISH: ${{ needs.publish.result }}
          CONFIRM: ${{ needs.confirm.result }}
          FINISH: ${{ needs.finish-release.result }}
          DOCS: ${{ needs.release-docs.result }}
          ACTION: ${{ steps.finalize.outputs.action }}
        run: |
          {
            echo "### Final state"
            if [ "$MODE" = release ]; then
              echo "Release of $VERSION: npm $PUBLISH, provenance $CONFIRM, GitHub release $FINISH, docs $DOCS."
              echo "Draft release action: ${ACTION:-none}"
            else
              echo "Checks only. Nothing was published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mark-not-published:
    name: Mark the release not published
    needs: summary
    if: always() && needs.summary.outputs.action == 'mark-not-published'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.summary.outputs.version }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "react-native: v$VERSION (not published)"
